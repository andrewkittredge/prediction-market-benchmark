[project]
name = "prediction-market-benchmark"
version = "0.1.0"
description = "LLM forecasting benchmark against prediction-market prices"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125.0",
    "claude-agent-sdk>=0.2.174",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.17.1",
    "pandas>=2.3.3",
    "prediction-markets",
    "scipy>=1.17.1",
    # mlflow 3.17's SQL store imports ORMSelectCompileState, removed in SQLAlchemy 2.1
    "sqlalchemy<2.1",
    "sqlmodel>=0.0.39",
    "statsmodels>=0.15.0",
    "tenacity>=9.1.4",
]

# Not a distributable package: the `benchmark/` folder is imported from the
# project root (`python -m benchmark.evaluate`).
[tool.uv]
package = false

[tool.uv.sources]
prediction-markets = { path = "../prediction-markets/prediction_markets", editable = true }
