[project]
name = "prediction-market-benchmark"
version = "0.1.0"
description = "LLM forecasting benchmark against prediction-market prices"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125.0",
    "claude-agent-sdk>=0.2.174",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.17.1",
    "pandas>=2.3.3",
    "prediction-markets",
    "scipy>=1.17.1",
    # mlflow 3.17's SQL store imports ORMSelectCompileState, removed in SQLAlchemy 2.1
    "snowflake-snowpark-python>=1.30",
    "sqlalchemy<2.1",
    "statsmodels>=0.15.0",
    "tenacity>=9.1.4",
]

[project.scripts]
build-dataset = "benchmark.dataset.build:main"
evaluate = "benchmark.evaluate:main"

# Installed editable into .venv (so the script above exists); only the
# `benchmark/` package is built.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.uv.sources]
prediction-markets = { path = "../prediction-markets/prediction_markets", editable = true }
